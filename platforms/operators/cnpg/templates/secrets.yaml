apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cnpg-initdb-secret
spec:
  refreshInterval: 1h
  target:
    name: cnpg-initdb-secret
  data:
  - secretKey: init.sql
    sourceRef:
      storeRef:
        name: bitwarden-secretsmanager
        kind: ClusterSecretStore
    remoteRef:
      key: 554dbe7e-27cb-4e62-b7d8-b2bc010aae81
      version: v1
---
