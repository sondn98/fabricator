apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg
spec:
  description: "CNPG cluster"
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  instances: 1

  enableSuperuserAccess: true
  superuserSecret:
    name: cnpg-superuser-secret

  startDelay: 300
  stopDelay: 300

  postgresql:
    parameters:
      shared_buffers: 256MB
      pg_stat_statements.max: '10000'
      pg_stat_statements.track: all
      auto_explain.log_min_duration: '10s'

  bootstrap:
    initdb:
      database: postgres
      owner: postgres
      secret:
        name: cnpg-superuser-secret
      postInitSQLRefs:
        secretRefs:
          - name: cnpg-initdb-secret
            key: init.sql

  storage:
    size: 3Gi

  resources: {}

  affinity:
    enablePodAntiAffinity: true
    topologyKey: failure-domain.beta.kubernetes.io/zone

  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: false
