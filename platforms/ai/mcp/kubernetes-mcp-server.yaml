kubernetes-mcp-server:
  replicaCount: 1

  # -- This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    registry: quay.io
    repository: containers/kubernetes_mcp_server
    version: latest

  serviceAccount:
    create: true

  rbac:
    create: true
    extraClusterRoles:
      - name: mcp-pod-reader
        rules:
          - apiGroups: ["apps"]
            resources: ["*"]
            verbs: ["get", "list", "watch"]
    extraClusterRoleBindings:
      - name: mcp-pod-reader
        roleRef:
          name: mcp-pod-reader

  service:
    type: ClusterIP
    port: 8080
    targetPort: http

  ingress:
    enabled: false

  httpRoute:
    enabled: false

  resources: {}

  config:
    port: "{{ .Values.service.port }}"
