seaweedfs:
  global:
    seaweedfs:
      createClusterRole: true
      image:
        name: chrislusf/seaweedfs
      loggingLevel: 1
      enableSecurity: false
      masterServer: null
      securityConfig:
        jwtSigning:
          volumeWrite: true
          volumeRead: false
          filerWrite: false
          filerRead: false
      serviceAccountName: "seaweedfs"
      automountServiceAccountToken: true
      certificates:
        duration: 87600h
        renewBefore: 720h
        alphacrds: false
      monitoring:
        enabled: false
        gatewayHost: null
        gatewayPort: null
        additionalLabels: {}
      enableReplication: false
      replicationPlacement: "001"
      extraEnvironmentVars:
        WEED_CLUSTER_DEFAULT: "sw"
        WEED_CLUSTER_SW_MASTER: "{{ include \"seaweedfs.cluster.masterAddress\" . }}"
        WEED_CLUSTER_SW_FILER: "{{ include \"seaweedfs.cluster.filerAddress\" . }}"

  master:
    enabled: true
    replicas: 1
    port: 9333
    grpcPort: 19333
    metricsPort: 9327
    ipBind: "0.0.0.0"
    volumePreallocate: false
    volumeSizeLimitMB: 1000
    loggingOverrideLevel: null
    garbageThreshold: null
    metricsIntervalSec: 15
    defaultReplication: "000"
    disableHttp: false
    resumeState: false
    raftHashicorp: false
    raftBootstrap: false
    electionTimeout: "10s"
    heartbeatInterval: "300ms"

    config: |-
      # Enter any extra configuration for master.toml here.
      # It may be a multi-line string.


    data:
      type: "hostPath"
      hostPathPrefix: /ssd

    logs:
      type: "hostPath"
      hostPathPrefix: /storage
      
    resources: {}
    updatePartition: 0
    affinity: |
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: {{ template "seaweedfs.name" . }}
                app.kubernetes.io/instance: {{ .Release.Name }}
                app.kubernetes.io/component: master
            topologyKey: kubernetes.io/hostname

    extraEnvironmentVars:
      WEED_MASTER_VOLUME_GROWTH_COPY_1: "7"
      WEED_MASTER_VOLUME_GROWTH_COPY_2: "6"
      WEED_MASTER_VOLUME_GROWTH_COPY_3: "3"
      WEED_MASTER_VOLUME_GROWTH_COPY_OTHER: "1"

  volume:
    enabled: true
    port: 8080
    grpcPort: 18080
    metricsPort: 9327
    ipBind: "0.0.0.0"
    replicas: 1
    loggingOverrideLevel: null
    pulseSeconds: null
    index: null
    fileSizeLimitMB: null
    minFreeSpacePercent: 1
    
    dataDirs:
      - name: data1
        type: "hostPath"
        hostPathPrefix: /ssd
        maxVolumes: 0
    
    resizeHook:
      enabled: true
      image: alpine/k8s:1.28.4

    idx:
     type: "persistentVolumeClaim"
     size: "20Gi"

    compactionMBps: "50"
    rack: null
    id: null
    dataCenter: null
    readMode: proxy
    whiteList: null
    imagesFixOrientation: false
    affinity: |
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: {{ template "seaweedfs.name" . }}
                app.kubernetes.io/instance: {{ .Release.Name }}
                app.kubernetes.io/component: {{ $volumeName }}
            topologyKey: kubernetes.io/hostname

  filer:
    enabled: true
    replicas: 1
    port: 8888
    grpcPort: 18888
    metricsPort: 9327
    ipBind: "0.0.0.0"
    dataCenter: null
    rack: null
    defaultReplicaPlacement: "000"
    disableDirListing: false
    maxMB: null
    encryptVolumeData: false
    redirectOnRead: false
    dirListLimit: 100000
    disableHttp: false
    enablePVC: false
    storage: 25Gi
    data:
      type: "hostPath"
      size: "1Gi"
      hostPathPrefix: /storage
    affinity: |
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: {{ template "seaweedfs.name" . }}
                app.kubernetes.io/instance: {{ .Release.Name }}
                app.kubernetes.io/component: filer
            topologyKey: kubernetes.io/hostname
    updatePartition: 0
    resources: {}
    extraEnvironmentVars:
      WEED_MYSQL_ENABLED: "false"
      WEED_MYSQL_HOSTNAME: "mysql-db-host"
      WEED_MYSQL_PORT: "3306"
      WEED_MYSQL_DATABASE: "sw_database"
      WEED_MYSQL_CONNECTION_MAX_IDLE: "5"
      WEED_MYSQL_CONNECTION_MAX_OPEN: "75"
      WEED_MYSQL_CONNECTION_MAX_LIFETIME_SECONDS: "600"
      WEED_MYSQL_INTERPOLATEPARAMS: "true"
      WEED_LEVELDB2_ENABLED: "true"
      WEED_FILER_OPTIONS_RECURSIVE_DELETE: "false"
      WEED_FILER_BUCKETS_FOLDER: "/buckets"

    data:
      type: "emptyDir"
      hostPathPrefix: /mnt/data
      claimName: seaweedfs-data-pvc
      size: "2Gi"
      
    affinity: |
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: {{ template "seaweedfs.name" . }}
                app.kubernetes.io/instance: {{ .Release.Name }}
                app.kubernetes.io/component: seaweedfs-all-in-one
            topologyKey: kubernetes.io/hostname
            
    resources: {}

  certificates:
    commonName: "SeaweedFS CA"
    ipAddresses: []
    keyAlgorithm: RSA
    keySize: 2048
    duration: 2160h  # 90d
    renewBefore: 360h  # 15d
    ca:
      duration: 87600h  # 10 years
      renewBefore: 720h  # 30d
      