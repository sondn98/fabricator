releases:
  - name: cert-manager
    namespace: cert-manager
    chart: jetstack/cert-manager
    version: v1.16.1
    values:
      - ./cert-manager.yaml.gotmpl
      - fullnameOverride: cert-manager
  
  - name: issuer
    namespace: cert-manager
    chart: ./issuer
    needs:
      - cert-manager/cert-manager
