# The CA key pair is injected from the environment rather than read off disk, so
# CI (.github/workflows/core.yml) can feed it straight from GitHub secrets.
# Both variables hold the PEM as generated - b64enc below does the encoding the
# Secret's `data` field needs.
#
# 1. Generate a private key:
# $> openssl genrsa -out core/cert-manager/ca/tls.key 2048
# 2. Generate a certificate:
# $> openssl req -x509 -nodes -new -sha256 -days 365 \
#     -key core/cert-manager/ca/tls.key \
#     -out core/cert-manager/ca/tls.crt \
#     -config core/cert-manager/openssl.cnf
# 3. Export them as-is (quotes matter - the PEM is multi-line):
# $> export CERT_MANAGER_CA_TLS_CRT="$(cat core/cert-manager/ca/tls.crt)"
# $> export CERT_MANAGER_CA_TLS_KEY="$(cat core/cert-manager/ca/tls.key)"
apiVersion: v1
kind: Secret
metadata:
  name: fabricator.local-ca
data:
  tls.crt: '{{ requiredEnv "CERT_MANAGER_CA_TLS_CRT" | b64enc }}'
  tls.key: '{{ requiredEnv "CERT_MANAGER_CA_TLS_KEY" | b64enc }}'
type: Opaque
