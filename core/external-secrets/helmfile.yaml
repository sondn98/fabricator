releases:
  - name: external-secrets
    namespace: external-secrets
    chart: external-secrets/external-secrets
    version: 0.12.1
    values:
      - ./external-secrets.yaml.gotmpl
      - fullnameOverride: external-secrets
    hooks:
      - events: ["postsync"]
        showlogs: true
        kubectlApply:
          kustomize: ./secret-store
