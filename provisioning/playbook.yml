---
- name: Prepare
  hosts: k3s_cluster
  remote_user: sondn98
  become: yes
  tags: prepare_cluster
  roles:
    - k3s.orchestration.prereq
    - k3s.orchestration.airgap
    - k3s.orchestration.raspberrypi

- name: Setup K3S server
  hosts: server
  become: true
  tags: prepare_cluster
  roles:
    - k3s.orchestration.k3s_server

- name: Setup K3S agent
  hosts: agent
  become: true
  tags: prepare_cluster
  roles:
    - k3s.orchestration.k3s_agent

# Once the cluster is up, deploy the Actions Runner Controller (ARC) Helm
# chart shipped in core/arc. This runs from the control node, which already
# has the cluster's kubeconfig merged in by the k3s_server role (context
# `cluster_context`, default "k3s-ansible").
- name: Install ARC helm chart
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tags: prepare_core_service
  tasks:
    - name: Deploy ARC helm chart
      kubernetes.core.helm:
        name: arc
        chart_ref: "{{ playbook_dir }}/../core/arc"
        release_namespace: arc
        create_namespace: true
        dependency_update: true
        wait: true
        values:
          fabricator:
            githubConfigSecret:
              github_token: "{{ lookup('env', 'GITHUB_ARC_ACCESS_TOKEN') }}"
        context: "{{ hostvars[groups['server'][0]]['cluster_context'] | default('k3s-ansible') }}"
